# Pemeriksaan otomatis sesuai SOP Git (docs/SOP_Git_Workflow.md bagian 3A):
# Pint (format kode), build frontend, dan seluruh test PHPUnit.
name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Token CI hanya boleh membaca isi repo (hak akses minimum)
permissions:
  contents: read

jobs:
  ci:
    name: Pint, Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # composer.lock butuh PHP >= 8.4.1 (paket Symfony 8)
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3
          coverage: none

      # Vite 8 butuh Node 20.19 atau 22.12+
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependency PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Siapkan .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint (format kode PHP)
        run: vendor/bin/pint --test

      - name: Build frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # Database test: SQLite in-memory (phpunit.xml)
      - name: PHPUnit
        run: php artisan test --compact --log-junit storage/logs/junit.xml

      # Tulis setiap tes yang gagal sebagai anotasi error: tampil di halaman
      # GitHub dan bisa dibaca lewat API check-runs tanpa perlu membuka log.
      - name: Anotasi tes yang gagal
        if: failure()
        run: |
          php -r '
            $xml = @simplexml_load_file("storage/logs/junit.xml");
            if (! $xml) {
                echo "::error title=PHPUnit::junit.xml tidak ada, PHPUnit gagal sebelum menjalankan tes. Lihat log langkah PHPUnit.\n";
                exit;
            }
            $root = getcwd()."/";
            $properti = fn (string $nilai): string => str_replace(["%", "\r", "\n", ":", ","], ["%25", "%0D", "%0A", "%3A", "%2C"], $nilai);
            $pesan = fn (string $nilai): string => str_replace(["%", "\r", "\n"], ["%25", "%0D", "%0A"], $nilai);
            foreach ($xml->xpath("//testcase[failure or error]") as $tes) {
                $node = $tes->failure ?: $tes->error;
                printf(
                    "::error file=%s,line=%s,title=%s::%s\n",
                    $properti(str_replace($root, "", (string) $tes["file"])),
                    $tes["line"],
                    $properti($tes["class"]."::".$tes["name"]),
                    $pesan(str_replace($root, "", substr(trim((string) $node), 0, 1500)))
                );
            }
          '
