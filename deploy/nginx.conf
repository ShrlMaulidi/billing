# Konfigurasi Nginx untuk MSS Billing (Ubuntu + PHP 8.4-FPM).
# Salin ke /etc/nginx/sites-available/mss-billing lalu ganti DOMAIN_ANDA dengan domain Anda.
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_ANDA;
    root /var/www/mss-billing/public;
    index index.php;
    charset utf-8;
    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Kompresi teks (CSS/JS/JSON/SVG) — unduhan pertama turun dari ±3,4 MB ke ±700 KB
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Aset hasil build ber-hash: aman di-cache selamanya
    location ^~ /build/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(css|js|svg|png|jpe?g|webp|ico|woff2?|ttf|eot)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Tolak file tersembunyi (.env, .git, dst.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
